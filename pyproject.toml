[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "48hfp-studio"
version = "3.0.0"
description = "Terminal-native AI co-pilot for short film festival pre-production."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "48HFP-Studio Team" }
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "google-genai>=0.1.0",
    "textual>=0.40.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0"
]

[project.scripts]
48hfp = "main:app"

[tool.setuptools.packages.find]
include = ["studio*"]

