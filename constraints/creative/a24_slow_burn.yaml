name: a24_slow_burn
description: A24-style indie psychological drama with deliberate pacing and lingering
  shots.
scenarios:
- Two long-lost friends reunite under suspicious circumstances during a power outage.
- A tense dinner party where unspoken secrets gradually unravel.
core_philosophy: Tension through silence, spatial intimacy, and understated subtext.
scene_economy: Long static takes, minimal cuts, letting dialogue breath with natural
  pauses.
progression_and_climax: Subtle character escalation building to a quiet, high-stakes
  emotional confrontation.
visuals_and_post: Desaturated warm tones, soft directional lighting, ambient acoustic
  score with subtle synth drones.
