name: wong_kar_wai
description: Fleeting human connections, unrequited love, passage of time, and urban
  loneliness.
core_philosophy: Limerence and memory—people are ships passing in the night, forever
  changed by brief encounters.
emotional_arc: Two lonely souls orbit each other in close proximity without ever fully
  aligning.
world_rules: Sultry, rain-soaked metropolis where expired canned goods and forgotten
  phone numbers hold eternal weight.
