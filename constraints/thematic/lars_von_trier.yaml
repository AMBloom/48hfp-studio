name: lars_von_trier
description: Provocative psychological endurance, martyrdom, moral hypocrisy, and
  human suffering.
core_philosophy: Truth is found by stripping away cinematic illusion and pushing characters
  to extremes.
emotional_arc: An idealist protagonist's selflessness is tested and brutalized by
  rigid societal hypocrisy.
world_rules: Forgiving rules do not exist; actions have immediate, unglamorized consequences.
