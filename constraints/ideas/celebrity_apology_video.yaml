name: celebrity_apology_video
description: A recently disgraced celebrity or public figure is recording an apology
  video to their supporters, when they are suddenly confronted by a disappointed follower.
inciting_incident: Prior to events of the film, the celebrity was caught displaying
  bizarre behavior in pricate.
complications: A fan, devasted by learning their hero wasn't who they thought they
  were, tracks the celebrity down and confronts them directly.
ending_targets: The celebrity makes a true apology to the fan, and the fan realizes
  their own obsession was worse than the celebrity's initial behavior.
